<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>여행자 게시판 — LoKo.i</title>
<meta name="theme-color" content="#2F6BFF">
<link rel="icon" type="image/png" href="assets/img/icon.png">
<link rel="apple-touch-icon" href="assets/img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .bd { padding-top: 24px; padding-bottom: 80px; max-width: 860px; }
  .bd h1 { font-family: var(--font-head); font-size: clamp(28px, 5vw, 40px); letter-spacing: -1px; margin: 0 0 4px; }
  .bd .sub { color: var(--ink-3); margin: 0 0 16px; font-size: 15px; }
  .hello { font-weight: 700; color: var(--accent-ink); font-size: 15px; margin: 0 0 4px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .tabs { display: flex; gap: 2px; flex: 1 1 auto; overflow-x: auto; }
  .tabs button { border: 0; background: none; font: 600 15px var(--font-body); color: var(--ink-3); padding: 12px 12px; min-height: 44px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
  .tabs button[aria-pressed=true] { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs .n { font-weight: 500; color: var(--ink-3); margin-left: 3px; font-size: 13px; }
  .search { flex: 0 1 220px; min-width: 0; margin: 6px 0; }
  .search input { width: 100%; font: 15px var(--font-body); padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; min-height: 40px; }
  @media (max-width: 600px) { .search { flex: 1 1 100%; } }
  .list { list-style: none; margin: 0; padding: 0; }
  .post { border-bottom: 1px solid var(--line); }
  .post button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; width: 100%; padding: 14px 4px; cursor: pointer; }
  .post button:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 8px; }
  .post button:hover .p-title { color: var(--accent-ink); }
  .p-cat { grid-column: 1; font-size: 13px; font-weight: 700; color: var(--accent-ink); }
  .p-title { grid-column: 1; font-weight: 600; font-size: 17px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .p-meta { grid-column: 1; font-size: 14px; color: var(--ink-3); }
  .p-side { grid-column: 2; grid-row: 1 / span 3; align-self: center; text-align: center; min-width: 56px; }
  .fit { display: inline-block; font: 800 20px var(--font-head); color: var(--ink); line-height: 1; }
  .fit small { display: block; font: 500 11px var(--font-body); color: var(--ink-3); margin-top: 3px; }
  .done-tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--ok); background: #E8F5EC; border-radius: 999px; padding: 3px 8px; }
  .empty { color: var(--ink-3); padding: 32px 4px; text-align: center; }
  .state { padding: 40px 4px; text-align: center; color: var(--ink-2); }
  .foot-note { color: var(--ink-3); font-size: 13px; margin-top: 20px; text-align: center; }
  dialog.dt { border: 0; padding: 0; border-radius: 20px; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
  dialog.dt::backdrop { background: rgba(17,17,20,.45); }
  .dt-top { position: sticky; top: 0; background: #fff; display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dt-body { padding: 18px; }
  .dt-body h2 { font-size: 20px; line-height: 1.4; margin: 4px 0 10px; }
  .dt-body dl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; margin: 0 0 14px; font-size: 15px; }
  .dt-body dt { color: var(--ink-3); }
  .dt-body dd { margin: 0; }
  .why { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .why span { font-size: 13px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 4px 10px; }
  .orig { font-size: 14px; color: var(--ink-3); margin: -4px 0 14px; }
  .orig summary { cursor: pointer; min-height: 32px; display: inline-flex; align-items: center; }
  .apply label { font-weight: 700; display: block; margin-bottom: 6px; }
  .apply textarea { width: 100%; font: 16px var(--font-body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; min-height: 96px; }
  .apply .hint { font-size: 13px; color: var(--ink-3); margin: 6px 0 12px; }
  .apply .btn { width: 100%; }
  .rules-mini { font-size: 13px; color: var(--ink-3); background: var(--bg-soft); border-radius: 12px; padding: 10px 12px; margin: 12px 0 0; }
  .msg-ok { background: #E8F5EC; color: var(--ok); border-radius: 12px; padding: 12px; font-weight: 600; }
  .msg-err { background: #FDECEC; color: var(--danger); border-radius: 12px; padding: 12px; font-weight: 600; margin-top: 10px; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="LoKo.i"><span class="brand-mark" aria-hidden="true">k</span>LoKo.i</a>
  </div>
</header>
<main class="wrap bd" id="main">
  <p class="hello" id="hello"></p>
  <h1 data-t="title">여행자 게시판</h1>
  <p class="sub" data-t="sub">신원 확인을 마친 현지인만 볼 수 있어요. 여행자의 이름·사진·연락처는 보이지 않아요.</p>
  <div id="app"><p class="state" data-t="loading">불러오는 중…</p></div>
  <p class="foot-note" data-t="foot">이 링크는 나만 쓰는 개인 링크예요. 다른 사람에게 보내지 마세요.</p>
</main>

<dialog class="dt" id="dt" aria-labelledby="dtTitle">
  <div class="dt-top"><b id="dtCat"></b><button class="btn btn-line btn-sm" type="button" id="dtClose" data-t="close">닫기</button></div>
  <div class="dt-body" id="dtBody"></div>
</dialog>

<script src="assets/config.js"></script>
<script>
(function () {
  'use strict';
  var T = {
    ko: {

      loading: '불러오는 중…', foot: '이 링크는 나만 쓰는 개인 링크예요. 다른 사람에게 보내지 마세요.', close: '닫기',
      hello: '{n}님, 안녕하세요', all: '전체', week: '이번 주', mine: '지원한 글', search: '검색 (활동·지역·국가)',
      fit: '잘 맞음', applied: '지원함', none: '지금은 조건에 맞는 여행자 글이 없어요. 새 글이 올라오면 다시 확인해 주세요.',
      noneMine: '아직 지원한 글이 없어요.', noHit: '검색 결과가 없어요.',
      bad: '링크가 맞지 않거나 사용이 멈췄어요. 인스타 @lokoi.kr로 문의해 주세요.', fail: '불러오지 못했어요. 잠시 뒤 다시 열어 주세요.',
      people: '명', with: '함께', when: '희망 날짜', stay: '여행 기간', time: '시간대', area: '지역', acts: '하고 싶은 활동',
      lang: '대화 언어', kor: '한국어', visit: '방문', age: '나이대', kids: '아이 나이', from: '국가', why: '나와 맞는 점',
      orig: '원문 보기', autoTr: '자동 번역이에요.',

      msgHint: '영어·번체 중국어로 번역해서 전달돼요. 연락처는 적지 마세요 (자동으로 지워져요).',
      send: '같이 할래요', sending: '보내는 중…',
      sent: '지원했어요! 여행자가 좋다고 하면 @lokoi.kr이 단체 DM으로 연결해 드려요.',
      dup: '이미 지원한 글이에요. 여행자의 답을 기다려 주세요.', closed: '이 글은 마감됐거나 더 이상 볼 수 없어요.',
      sendFail: '보내지 못했어요. 잠시 뒤 다시 시도해 주세요.',
      rules: '만남 규칙: 낮·공개 장소, 밤 10시 전 마무리, 숙소·집·개인 차량·술 중심 활동 금지, 각자 계산.',
      demo: '예시 화면이에요. 가상의 글이고 지원해도 저장되지 않아요.', want: '{a} 함께해요', today: '오늘', tomorrow: '내일'
    },
    en: {
      title: 'Traveler board', sub: 'Only ID-checked locals can see this. Travelers’ names, photos and contacts are hidden.',
      loading: 'Loading…', foot: 'This is your personal link. Please don’t share it.', close: 'Close',
      hello: 'Hi {n}', all: 'All', week: 'This week', mine: 'Applied', search: 'Search (activity, area, country)',
      fit: 'match', applied: 'Applied', none: 'No matching trips right now. Check back when new ones come in.',
      noneMine: 'You haven’t applied to any trips yet.', noHit: 'No results.',
      bad: 'This link is not valid or has been paused. Please message @lokoi.kr on Instagram.', fail: 'Couldn’t load. Please try again later.',
      people: '', with: 'With', when: 'Preferred date', stay: 'Trip dates', time: 'Time', area: 'Area', acts: 'Activities',
      lang: 'Languages', kor: 'Korean', visit: 'Visit', age: 'Age range', kids: 'Kids’ ages', from: 'Country', why: 'Why it fits you',
      orig: 'Show original', autoTr: 'Auto-translated.',
      msgL: 'A note to the traveler', msgPh: 'e.g. I love pork soup too! Let’s go to my favorite place in Nampo.',
      msgHint: 'We translate it for the traveler. Don’t add contact details (they are removed).',
      send: 'I’d like to join', sending: 'Sending…',
      sent: 'Sent! If the traveler says yes, @lokoi.kr will connect you in a group DM.',
      dup: 'You already applied. Please wait for the traveler’s answer.', closed: 'This trip is closed or no longer available.',
      sendFail: 'Couldn’t send. Please try again.',
      rules: 'Rules: daytime, public places, wrap up by 10 pm, no homes, hotels, private cars or drinking-focused plans, everyone pays their own way.',
      demo: 'Demo page. These trips are made up and nothing is saved.', want: 'Join for {a}', today: 'Today', tomorrow: 'Tomorrow'
    }
  };
  var V = {
    'Walks & nature': '산책·자연', 'Sports': '운동', 'Games': '경기 관람', 'Food & markets': '음식·시장', 'Culture & art': '문화·예술',
    'By the sea': '바다', 'Learn & daily life': '한국어·요리·지하철 타기', 'Views & old town': '전망·원도심 골목', 'Kids & family': '아이·가족 활동',
    'Haeundae / Centum': '해운대·센텀', 'Gwangalli / Suyeong': '광안리·수영', 'Seomyeon / Jeonpo': '서면·전포', 'Nampo / Jung-gu': '남포·중구',
    'Yeongdo': '영도', 'Gijang / Songjeong': '기장·송정', 'Anywhere': '상관없음', 'Not decided': '미정', 'Other': '기타',
    'Morning': '오전', 'Afternoon': '오후', 'Evening': '저녁',
    'English': '영어', 'Chinese': '중국어', 'Japanese': '일본어', 'Korean': '한국어',
    'None': '못 해요', 'A little': '몇 마디', 'Conversational': '대화 가능',
    'Solo': '혼자', 'Friends': '친구', 'Partner': '연인·배우자', 'Family with kids': '가족(아이 동반)', 'Family (adults)': '가족(성인)', 'Group (5+)': '단체(5명+)',
    'First time in Korea': '한국 첫 방문', 'First time in Busan': '부산 첫 방문', 'Been to Busan': '부산 재방문',
    'Taiwan': '대만', 'Hong Kong': '홍콩', 'Japan': '일본', 'USA': '미국', 'Singapore': '싱가포르', 'UK': '영국', 'Germany': '독일', 'China': '중국',
    'Australia': '호주', 'Canada': '캐나다', 'France': '프랑스', 'Malaysia': '말레이시아', 'Thailand': '태국', 'Vietnam': '베트남', 'Philippines': '필리핀', 'Indonesia': '인도네시아'
  };
  var DAYS = { ko: ['일', '월', '화', '수', '목', '금', '토'], en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] };

  var qs = new URLSearchParams(location.search);
  var token = qs.get('t') || '', demo = qs.get('demo') === '1';
  var lang = 'ko', state = { posts: [], applied: [], tab: 'all', q: '' };
  var app = document.getElementById('app'), dlg = document.getElementById('dt');
  var cfg = window.LOKOI_CONFIG || {};

  // 개인 링크의 토큰이 주소창·방문 기록에 오래 남지 않게 지움 (이 탭에서만 기억)
  try {
    if (token) { sessionStorage.setItem('lokoi_board_t', token); history.replaceState(null, '', location.pathname + (demo ? '?demo=1' : '')); }
    else token = sessionStorage.getItem('lokoi_board_t') || '';
  } catch (e) {}

  function t(k, vars) { var s = (T[lang] || T.ko)[k] || T.ko[k] || k; if (vars) Object.keys(vars).forEach(function (x) { s = s.replace('{' + x + '}', vars[x]); }); return s; }
  function v(x) { x = String(x || '').trim(); return lang === 'ko' ? (V[x] || x) : x; }
  function list(x) { return String(x || '').split(/\s*,\s*/).filter(Boolean); }
  function vl(x, sep) { return list(x).map(v).join(sep || ', '); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function localize() { document.documentElement.lang = lang; document.querySelectorAll('[data-t]').forEach(function (n) { n.textContent = t(n.getAttribute('data-t')); }); document.title = t('title') + ' — LoKo.i'; }

  function todayStr(offset) { var d = new Date(Date.now() + 9 * 3600e3 + (offset || 0) * 864e5); return d.toISOString().slice(0, 10); }
  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); if (!m) return '';
    if (s === todayStr()) return t('today');
    if (s === todayStr(1)) return t('tomorrow');
    var day = DAYS[lang][new Date(Date.UTC(+m[1], m[2] - 1, +m[3])).getUTCDay()];
    return lang === 'ko' ? (+m[2]) + '월 ' + (+m[3]) + '일(' + day + ')' : day + ' ' + (+m[2]) + '/' + (+m[3]);
  }
  function size(p) { var n = p.group_size || '1'; return lang === 'ko' ? n + '명' : n + (n === '1' ? ' person' : ' people'); }
  function title(p) { return p.details || t('want', { a: vl(p.activities, lang === 'ko' ? '·' : ' & ') }); }
  function dateOf(p) { return p.preferred_date || p.arrive || ''; }

  function filtered() {
    var q = state.q.toLowerCase(), wk = todayStr(7);
    return state.posts.filter(function (p) {
      if (state.tab === 'mine' && state.applied.indexOf(p.id) === -1) return false;
      if (state.tab === 'week') { var d = dateOf(p); if (!d || d > wk) return false; }
      if (!q) return true;
      var hay = [p.details, p.details_src, p.country, v(p.country), p.activities, vl(p.activities), p.areas, vl(p.areas), p.stay_area, vl(p.stay_area)].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  function render() {
    app.textContent = '';
    if (demo) app.appendChild(el('p', 'msg-ok', t('demo')));
    var bar = el('div', 'bar'), tabs = el('div', 'tabs'); tabs.setAttribute('role', 'group');
    var wk = todayStr(7);
    [['all', state.posts.length], ['week', state.posts.filter(function (p) { var d = dateOf(p); return d && d <= wk; }).length], ['mine', state.applied.filter(function (id) { return state.posts.some(function (p) { return p.id === id; }); }).length]]
      .forEach(function (x) {
        var b = el('button', null, t(x[0])); b.type = 'button'; b.setAttribute('aria-pressed', String(state.tab === x[0]));
        b.appendChild(el('span', 'n', String(x[1])));
        b.addEventListener('click', function () { state.tab = x[0]; render(); });
        tabs.appendChild(b);
      });
    var sw = el('div', 'search'), si = el('input'); si.type = 'search'; si.placeholder = t('search'); si.setAttribute('aria-label', t('search')); si.value = state.q;
    si.addEventListener('input', function () { state.q = si.value.trim(); drawList(ul); });
    sw.appendChild(si); bar.appendChild(tabs); bar.appendChild(sw); app.appendChild(bar);
    var ul = el('ul', 'list'); app.appendChild(ul); drawList(ul);
  }

  function drawList(ul) {
    ul.textContent = '';
    var rows = filtered();
    if (!rows.length) { ul.appendChild(el('li', 'empty', state.q ? t('noHit') : state.tab === 'mine' ? t('noneMine') : t('none'))); return; }
    rows.forEach(function (p) {
      var li = el('li', 'post'), b = el('button'); b.type = 'button';
      b.appendChild(el('span', 'p-cat', vl(p.activities, ' · ')));
      b.appendChild(el('span', 'p-title', title(p)));
      b.appendChild(el('span', 'p-meta', [v(p.country), size(p), fmtDate(dateOf(p)), vl(p.time_slots, '·'), vl(p.areas || p.stay_area, '·')].filter(Boolean).join(' · ')));
      var side = el('span', 'p-side');
      if (state.applied.indexOf(p.id) !== -1) side.appendChild(el('span', 'done-tag', t('applied')));
      else { var f = el('span', 'fit', String(p.score)); f.appendChild(el('small', null, t('fit'))); side.appendChild(f); }
      b.appendChild(side);
      b.addEventListener('click', function () { open(p); });
      li.appendChild(b); ul.appendChild(li);
    });
  }

  function open(p) {
    document.getElementById('dtCat').textContent = vl(p.activities, ' · ');
    var body = document.getElementById('dtBody'); body.textContent = '';
    var h = el('h2', null, title(p)); h.id = 'dtTitle'; body.appendChild(h);
    if (p.details && p.details_src && p.details !== p.details_src) {
      var o = el('details', 'orig'); o.appendChild(el('summary', null, t('autoTr') + ' ' + t('orig'))); o.appendChild(el('p', null, p.details_src)); body.appendChild(o);
    }
    // 맞는 이유는 매칭 엔진이 한국어로 만들어서 한국어 게시판에서만 보여 줌 (영어 값은 한국어로 바꿈)
    if (lang === 'ko' && p.reasons && p.reasons.length) {
      var w = el('div', 'why'); w.setAttribute('aria-label', t('why'));
      p.reasons.forEach(function (r) { Object.keys(V).forEach(function (k) { r = r.split(k).join(V[k]); }); w.appendChild(el('span', null, r)); });
      body.appendChild(w);
    }
    var dl = el('dl');
    [[t('from'), v(p.country)], [t('age'), p.age_range], [t('with'), [v(p.travelling_with), size(p)].filter(Boolean).join(' · ')], [t('kids'), p.kids_ages],
     [t('when'), fmtDate(p.preferred_date)], [t('stay'), p.arrive && p.leave ? fmtDate(p.arrive) + ' – ' + fmtDate(p.leave) : ''],
     [t('time'), vl(p.time_slots)], [t('area'), vl(p.areas || p.stay_area)], [t('acts'), vl(p.activities)],
     [t('lang'), vl(p.languages)], [t('kor'), v(p.korean_level)], [t('visit'), v(p.first_visit)]]
      .forEach(function (r) { if (!r[1]) return; dl.appendChild(el('dt', null, r[0])); dl.appendChild(el('dd', null, r[1])); });
    body.appendChild(dl);

    var box = el('div', 'apply');
    if (state.applied.indexOf(p.id) !== -1) box.appendChild(el('p', 'msg-ok', t('dup')));
    else {
      var lab = el('label', null, t('msgL')); lab.htmlFor = 'msg';
      var ta = el('textarea'); ta.id = 'msg'; ta.maxLength = 500; ta.placeholder = t('msgPh');
      var btn = el('button', 'btn btn-primary', t('send')); btn.type = 'button';
      var err = el('p', 'msg-err'); err.hidden = true;
      btn.addEventListener('click', function () {
        btn.disabled = true; btn.textContent = t('sending'); err.hidden = true;
        send(p.id, ta.value.trim()).then(function (r) {
          if (r.ok) {
            if (state.applied.indexOf(p.id) === -1) state.applied.push(p.id);
            box.textContent = ''; box.appendChild(el('p', 'msg-ok', r.dup ? t('dup') : t('sent'))); render();
          } else { err.textContent = r.error === 'closed' ? t('closed') : r.error === 'invalid' ? t('bad') : t('sendFail'); err.hidden = false; btn.disabled = false; btn.textContent = t('send'); }
        });
      });
      box.appendChild(lab); box.appendChild(ta); box.appendChild(el('p', 'hint', t('msgHint'))); box.appendChild(btn); box.appendChild(err);
    }
    box.appendChild(el('p', 'rules-mini', t('rules')));
    body.appendChild(box);
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  document.getElementById('dtClose').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

  function send(id, message) {
    if (demo) return Promise.resolve({ ok: true });
    return fetch(cfg.ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'board_apply', token: token, post_id: id, message: message }) })
      .then(function (r) { return r.json(); }).catch(function () { return { ok: false }; });
  }

  function start(d) {
    lang = d.lang === 'en' ? 'en' : 'ko'; localize();
    if (d.me && d.me.name) document.getElementById('hello').textContent = t('hello', { n: d.me.name });
    state.posts = d.posts || []; state.applied = d.applied || [];
    render();
  }
  function fail(key) { localize(); app.textContent = ''; app.appendChild(el('p', 'state', t(key))); }

  if (demo) { start(DEMO()); return; }
  if (!token || !cfg.ENDPOINT) { fail('bad'); return; }
  fetch(cfg.ENDPOINT + '?board=' + encodeURIComponent(token))
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.ok) start(d); else fail(d.error === 'invalid' ? 'bad' : 'fail'); })
    .catch(function () { fail('fail'); });
