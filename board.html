      'Learn & daily life': '學韓文、做菜、搭地鐵', 'Views & old town': '景觀與老街巷弄', 'Kids & family': '親子活動',
      'Haeundae / Centum': '海雲台 · Centum', 'Gwangalli / Suyeong': '廣安里 · 水營', 'Seomyeon / Jeonpo': '西面 · 田浦', 'Nampo / Jung-gu': '南浦 · 中區',
      'Yeongdo': '影島', 'Gijang / Songjeong': '機張 · 松亭', 'Anywhere': '都可以', 'Not decided': '未定', 'Other': '其他',
      'Morning': '上午', 'Afternoon': '下午', 'Evening': '晚上', 'Weekday daytime': '平日白天', 'Weekday evening': '平日晚上', 'Weekend': '週末',
      'English': '英文', 'Chinese': '中文', 'Japanese': '日文', 'Korean': '韓文',
      'None': '還不會', 'A little': '會幾個單字', 'Conversational': '能聊天', 'Basic': '基礎（翻譯 App）', 'Fluent': '流利',
      'Solo': '一個人', 'Friends': '朋友', 'Partner': '伴侶', 'Family with kids': '家人（有小孩）', 'Family (adults)': '家人（成人）', 'Group (5+)': '團體（5 人以上）',
      'First time in Korea': '第一次來韓國', 'First time in Busan': '第一次來釜山', 'Been to Busan': '來過釜山',
      'Born here': '土生土長', '10+ years': '10 年以上', '3-10 years': '3–10 年', 'Under 3 years': '未滿 3 年',
      'Once to try': '先試一次', '1-2 a month': '每月 1–2 次', 'Most weeks': '幾乎每週',
      'Taiwan': '台灣', 'Hong Kong': '香港', 'Japan': '日本', 'USA': '美國', 'Singapore': '新加坡', 'UK': '英國', 'Germany': '德國', 'China': '中國',
      'Korea': '韓國', 'South Korea': '韓國', 'Malaysia': '馬來西亞', 'Thailand': '泰國', 'Vietnam': '越南'
    }
  };
  var DAYS = { ko: ['일', '월', '화', '수', '목', '금', '토'], en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], zh: ['日', '一', '二', '三', '四', '五', '六'] };

  var qs = new URLSearchParams(location.search), demo = qs.get('demo') === '1', cfg = window.LOKOI_CONFIG || {};
  var app = document.getElementById('app'), top = document.getElementById('top'), dlg = document.getElementById('dt'), sel = document.getElementById('lang');
  var lang = 'en', token = '', data = null, state = { tab: 'all', q: '' };

  function store(k, v) { try { if (v == null) return localStorage.getItem(k); if (v === '') localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  // 개인 링크(?t=)는 이 기기에 기억하고 주소창에서는 지움
  token = qs.get('t') || '';
  if (token && !demo) { store('lokoi_board_t', token); qs.delete('t'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '')); }
  else if (!demo) token = store('lokoi_board_t') || '';

  lang = (function () {
    var q = qs.get('lang'); if (T[q]) return q;
    var s = store('lokoi_lang'); if (T[s]) return s;
    var l = String((navigator.languages || [navigator.language || 'en'])[0]).toLowerCase();
    return l.indexOf('zh') === 0 ? 'zh' : l.indexOf('ko') === 0 ? 'ko' : 'en';
  })();
  sel.value = lang;
  sel.addEventListener('change', function () { lang = sel.value; store('lokoi_lang', lang); load(); });

  function t(k, vars) { var s = (T[lang] || T.en)[k]; if (s == null) s = T.en[k] || k; if (vars) Object.keys(vars).forEach(function (x) { s = s.replace('{' + x + '}', vars[x]); }); return s; }
  function v(x) { x = String(x || '').trim(); return (V[lang] && V[lang][x]) || x; }
  function list(x) { return String(x || '').split(/\s*,\s*/).filter(Boolean); }
  function vl(x, sep) { return list(x).map(v).join(sep || ', '); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function localize() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : lang;
    document.querySelectorAll('[data-t]').forEach(function (n) { n.textContent = t(n.getAttribute('data-t')); });
    document.title = t('title');
  }
  function todayStr(offset) { return new Date(Date.now() + 9 * 3600e3 + (offset || 0) * 864e5).toISOString().slice(0, 10); }
  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); if (!m) return '';
    if (s === todayStr()) return t('today');
    if (s === todayStr(1)) return t('tomorrow');
    var day = DAYS[lang][new Date(Date.UTC(+m[1], m[2] - 1, +m[3])).getUTCDay()];
    if (lang === 'ko') return (+m[2]) + '월 ' + (+m[3]) + '일(' + day + ')';
    if (lang === 'zh') return (+m[2]) + '/' + (+m[3]) + '（' + day + '）';
    return day + ' ' + (+m[2]) + '/' + (+m[3]);
  }
  // 여행인 · 대만 / 현지인 · 부산 (대만 출신)
  function whoLabel(p) {
    if (p.type === 'traveler') return t('traveler') + ' · ' + v(p.country || '?');
    var s = t('local') + ' · ' + t('busan');
    if (/foreign/i.test(p.resident_type || '') && p.nationality) s += ' (' + t('from_x', { c: v(p.nationality) }) + ')';
    return s;
  }
  function title(p) {
    if (p.note) return p.note;
    var a = vl(p.activities, lang === 'en' ? ' & ' : '·');
    return t(p.type === 'traveler' ? 'wantT' : 'wantL', { a: a });
  }
  function meta(p) {
    if (p.type === 'traveler') return [t('people', { n: p.group_size || '1' }), fmtDate(p.preferred_date || p.arrive), vl(p.time_slots, '·'), vl(p.areas || p.stay_area, '·')];
    return [vl(p.availability, '·'), vl(p.areas, '·'), vl(p.languages, '·')];
  }
  function fitOf(p) { return data && data.me && data.me.fit ? data.me.fit[p.id] : undefined; }
  function isMine(p) { return data && data.me && data.me.id === p.id; }
  function sent(p) { return data && data.me && (data.me.applied || []).indexOf(p.id) !== -1; }

  function load() {
    localize();
    if (demo) { data = DEMO(); render(); return; }
    if (!cfg.ENDPOINT) { fail('fail'); return; }
    app.textContent = ''; app.appendChild(el('p', 'state', t('loading')));
    fetch(cfg.ENDPOINT + '?board=1&lang=' + lang + (token ? '&t=' + encodeURIComponent(token) : ''))
      .then(function (r) { return r.json(); })
      .then(function (d) { if (!d.ok) return fail('fail'); data = d; render(); })
      .catch(function () { fail('fail'); });
  }
  function fail(k) { top.textContent = ''; app.textContent = ''; app.appendChild(el('p', 'state', t(k))); }

  function writeButtons(box) {
    var c = el('div', 'cta');
    var a = el('a', 'btn btn-primary', t('writeT')); a.href = 'apply.html?lang=' + lang;
    var b = el('a', 'btn btn-line', t('writeL')); b.href = 'local.html?lang=' + lang;
    c.appendChild(a); c.appendChild(b); box.appendChild(c);
  }

  function renderTop() {
    top.textContent = '';
    if (demo) top.appendChild(el('p', 'msg-info', t('demo'))), top.lastChild.style.marginBottom = '12px';
    if (data.bad_token) top.appendChild(el('p', 'msg-err', t('badToken')));
    var me = data.me;
    if (!me) { writeButtons(top); return; }
    var bar = el('div', 'mebar');
    bar.appendChild(el('b', null, t('meHello', { n: me.name, w: t(me.type) })));
    var info = !me.verified ? t('meUnverified') : me.public ? t('mePublic') : t('mePrivate');
    bar.appendChild(el('span', 'grow', info));
    if (me.verified) {
      var tg = el('button', 'btn btn-line btn-sm', me.public ? t('hide') : t('show')); tg.type = 'button';
      tg.addEventListener('click', function () {
        var show = !me.public;
        if (!show && !window.confirm(t('hideAsk'))) return;
        tg.disabled = true;
        post({ action: 'board_visibility', token: token, show: show }).then(function (r) { tg.disabled = false; if (r.ok) { me.public = show; load(); } });
      });
      bar.appendChild(tg);
    }
    top.appendChild(bar);
  }

  function render() {
    renderTop();
    app.textContent = '';
    var posts = data.posts || [];
    var bar = el('div', 'bar'), tabs = el('div', 'tabs');
    var defs = [['all', posts.length], ['traveler', posts.filter(function (p) { return p.type === 'traveler'; }).length], ['local', posts.filter(function (p) { return p.type === 'local'; }).length]];
    if (data.me) defs.push(['mine', posts.filter(sent).length]);
    defs.forEach(function (x) {
      var b = el('button', null, t(x[0])); b.type = 'button'; b.setAttribute('aria-pressed', String(state.tab === x[0]));
      b.appendChild(el('span', 'n', String(x[1])));
      b.addEventListener('click', function () { state.tab = x[0]; render(); });
      tabs.appendChild(b);
    });
    var sw = el('div', 'search'), si = el('input'); si.type = 'search'; si.placeholder = t('search'); si.setAttribute('aria-label', t('search')); si.value = state.q;
    si.addEventListener('input', function () { state.q = si.value.trim(); drawList(ul); });
    sw.appendChild(si); bar.appendChild(tabs); bar.appendChild(sw); app.appendChild(bar);
    var ul = el('ul', 'list'); app.appendChild(ul); drawList(ul);
  }

  function drawList(ul) {
    ul.textContent = '';
    var q = state.q.toLowerCase();
    var rows = (data.posts || []).filter(function (p) {
      if (state.tab === 'traveler' || state.tab === 'local') { if (p.type !== state.tab) return false; }
      if (state.tab === 'mine' && !sent(p)) return false;
      if (!q) return true;
      return [p.note, p.note_src, p.country, v(p.country), p.nationality, v(p.nationality), p.activities, vl(p.activities), p.areas, vl(p.areas), p.stay_area, vl(p.stay_area)].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    // 내 링크가 있으면 상대편 글 중 잘 맞는 글을 위로
    if (data.me) rows = rows.slice().sort(function (a, b) { var fa = fitOf(a), fb = fitOf(b); return (typeof fb === 'number' ? fb : -1) - (typeof fa === 'number' ? fa : -1); });
    if (!rows.length) { ul.appendChild(el('li', 'empty', state.q ? t('noHit') : state.tab === 'mine' ? t('noneMine') : t('none'))); return; }
    rows.forEach(function (p) {
      var li = el('li', 'post'), b = el('button'); b.type = 'button';
      var tp = el('span', 'p-top'); tp.appendChild(el('span', 'who ' + p.type, whoLabel(p)));
      if (p.age_range) tp.appendChild(el('span', 'p-cat', p.age_range));
      tp.appendChild(el('span', 'p-cat', vl(p.activities, ' · ')));
      b.appendChild(tp);
      b.appendChild(el('span', 'p-title', title(p)));
      b.appendChild(el('span', 'p-meta', meta(p).filter(Boolean).join(' · ')));
      var side = el('span', 'p-side'), f = fitOf(p);
      if (isMine(p)) side.appendChild(el('span', 'mine-tag', t('myPost')));
      else if (sent(p)) side.appendChild(el('span', 'done-tag', t('applied')));
      else if (typeof f === 'number') { var fs = el('span', 'fit', String(f)); fs.appendChild(el('small', null, t('fit'))); side.appendChild(fs); }
      b.appendChild(side);
      b.addEventListener('click', function () { open(p); });
      li.appendChild(b); ul.appendChild(li);
    });
  }

  function open(p) {
    var who = document.getElementById('dtWho'); who.textContent = ''; who.appendChild(el('span', 'who ' + p.type, whoLabel(p)));
    var body = document.getElementById('dtBody'); body.textContent = '';
    var h = el('h2', null, title(p)); h.id = 'dtTitle'; body.appendChild(h);
    if (p.note && p.note_src && p.note !== p.note_src) {
      var o = el('details', 'orig'); o.appendChild(el('summary', null, t('autoTr') + ' ' + t('orig'))); o.appendChild(el('p', null, p.note_src)); body.appendChild(o);
    }
    var dl = el('dl'), rows = p.type === 'traveler'
      ? [[t('from'), v(p.country)], [t('age'), p.age_range], [t('with'), [v(p.travelling_with), t('people', { n: p.group_size || '1' })].filter(Boolean).join(' · ')], [t('kids'), p.kids_ages],
         [t('when'), fmtDate(p.preferred_date)], [t('stay'), p.arrive && p.leave ? fmtDate(p.arrive) + ' – ' + fmtDate(p.leave) : ''],
         [t('time'), vl(p.time_slots)], [t('area'), vl(p.areas || p.stay_area)], [t('acts'), vl(p.activities)],
         [t('lang'), vl(p.languages)], [t('kor'), v(p.korean_level)], [t('visit'), v(p.first_visit)]]
      : [[t('age'), p.age_range], [t('years'), v(p.busan_years)], [t('avail'), vl(p.availability)], [t('freq'), v(p.frequency)],
         [t('area'), vl(p.areas)], [t('acts'), vl(p.activities)], [t('lang'), vl(p.languages)], [t('level'), v(p.language_level)],
         [t('maxg'), p.max_group ? t('people', { n: p.max_group }) : '']];
    rows.forEach(function (r) { if (!r[1]) return; dl.appendChild(el('dt', null, r[0])); dl.appendChild(el('dd', null, r[1])); });
    body.appendChild(dl);
    body.appendChild(joinBox(p));
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }

  function joinBox(p) {
    var box = el('div', 'join'), f = fitOf(p);
    if (isMine(p)) return box;
    if (!data.me) { box.appendChild(el('p', 'msg-info', t('needPost'))); writeButtons(box); }
    else if (sent(p)) box.appendChild(el('p', 'msg-ok', t('dup')));
    else if (typeof f !== 'number') box.appendChild(el('p', 'msg-info', t(f === 'fit' ? 'no_fit' : f || 'closed')));
    else {
      var lab = el('label', null, t('msgL')); lab.htmlFor = 'msg';
      var ta = el('textarea'); ta.id = 'msg'; ta.maxLength = 500; ta.placeholder = t('msgPh');
      var btn = el('button', 'btn btn-primary', t('send')); btn.type = 'button';
      var err = el('p', 'msg-err'); err.hidden = true;
      btn.addEventListener('click', function () {
        btn.disabled = true; btn.textContent = t('sending'); err.hidden = true;
        post({ action: 'board_apply', token: token, post_id: p.id, message: ta.value.trim() }).then(function (r) {
          if (r.ok) {
            if (!sent(p)) data.me.applied.push(p.id);
            box.textContent = ''; box.appendChild(el('p', 'msg-ok', r.dup ? t('dup') : t('sent'))); box.appendChild(el('p', 'rules-mini', t('rules')));
            render();
          } else {
            err.textContent = t(r.error === 'fit' ? 'no_fit' : r.error || 'sendFail'); err.hidden = false; btn.disabled = false; btn.textContent = t('send');
          }
        });
      });
      box.appendChild(lab); box.appendChild(ta); box.appendChild(el('p', 'hint', t('msgHint'))); box.appendChild(btn); box.appendChild(err);
    }
    box.appendChild(el('p', 'rules-mini', t('rules')));
    return box;
  }
  document.getElementById('dtClose').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

  function post(body) {
    if (demo) return Promise.resolve({ ok: true });
    return fetch(cfg.ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).catch(function () { return { ok: false }; });
  }

  // 예시 데이터 (?demo=1, ?demo=1&as=traveler 는 여행인 시점, &as=none 은 링크 없는 방문자)
  function DEMO() {
    var d = function (n) { return todayStr(n); }, as = qs.get('as');
    var ko = lang === 'ko';
    var posts = [
      { id: 'T1', type: 'traveler', posted: d(0), country: 'Taiwan', age_range: '25-34', travelling_with: 'Friends', group_size: '2', first_visit: 'First time in Busan', arrive: d(2), leave: d(6), preferred_date: d(3), time_slots: 'Afternoon', areas: 'Nampo / Jung-gu', activities: 'Food & markets, Views & old town', languages: 'Chinese, English', korean_level: 'A little', note: ko ? '현지인이 가는 돼지국밥집에 가 보고 싶어요. 국제시장도 구경하고 싶어요!' : 'I want to try a pork soup place locals go to, and walk around Gukje Market!', note_src: '想去在地人常去的豬肉湯飯店，也想逛國際市場！' },
      { id: 'L1', type: 'local', posted: d(-1), resident_type: 'Korean', age_range: '25-29', busan_years: 'Born here', areas: 'Nampo / Jung-gu, Yeongdo', activities: 'Food & markets, Views & old town', availability: 'Weekend, Weekday evening', frequency: '1-2 a month', languages: 'Chinese, English', language_level: 'Conversational', max_group: '4', note: ko ? '남포동 토박이예요. 시장 골목 맛집과 영도 바다 산책 같이 해요.' : 'Born in Nampo. Let’s eat in the market alleys and walk by the sea in Yeongdo.', note_src: '남포동 토박이예요. 시장 골목 맛집과 영도 바다 산책 같이 해요.' },
      { id: 'T2', type: 'traveler', posted: d(-1), country: 'Korea', age_range: '25-34', travelling_with: 'Solo', group_size: '1', arrive: d(1), leave: d(3), preferred_date: d(2), time_slots: 'Evening', areas: 'Seomyeon / Jeonpo', activities: 'Sports, Games', languages: 'Korean, English', korean_level: '', note: ko ? '서울에서 혼자 왔어요. 사직구장 직관 같이 하실 분!' : 'Came alone from Seoul. Anyone for a game at Sajik stadium?', note_src: '서울에서 혼자 왔어요. 사직구장 직관 같이 하실 분!' },
      { id: 'L4', type: 'local', posted: d(-2), resident_type: 'Foreign resident', nationality: 'Taiwan', age_range: '25-29', busan_years: '3-10 years', areas: 'Gwangalli / Suyeong', activities: 'Walks & nature, By the sea', availability: 'Weekend', frequency: 'Most weeks', languages: 'Chinese, English, Korean', language_level: 'Fluent', max_group: '4', note: '', note_src: '' },
      { id: 'T3', type: 'traveler', posted: d(-3), country: 'Hong Kong', age_range: '35-44', travelling_with: 'Family with kids', group_size: '4', kids_ages: '6, 9', arrive: d(8), leave: d(12), preferred_date: d(9), time_slots: 'Morning', areas: 'Haeundae / Centum', activities: 'Kids & family, By the sea', languages: 'Chinese, English', korean_level: 'None', note: '', note_src: '' }
    ];
    var me = as === 'none' ? null : as === 'traveler'
      ? { id: 'T1', type: 'traveler', name: 'Mei', public: true, verified: true, applied: [], fit: { L1: 88, L4: 64, T2: 'same', T3: 'same' } }
      : { id: 'L1', type: 'local', name: '지은', public: true, verified: true, applied: ['T3'], fit: { T1: 86, T2: 71, T3: 52, L4: 'same' } };
    return { ok: true, lang: lang, posts: posts, me: me };
  }

  load();
})();
